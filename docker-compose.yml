version: '3.8'

services:
  web:
    build: .
    container_name: medinova_web
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    volumes:
      - .:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  tests:
    build: .
    container_name: medinova_tests
    volumes:
      - .:/app
    command: python -m pytest --cov=src --cov-fail-under=80